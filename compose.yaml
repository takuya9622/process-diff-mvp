services:
  web:
    image: process-diff-mvp-web:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-process-diff-local-development-secret-change-me}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://web:3000}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-process_diff}:${POSTGRES_PASSWORD:-process_diff_local}@db:5432/${POSTGRES_DB:-process_diff}"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  db:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-process_diff}"
      POSTGRES_USER: "${POSTGRES_USER:-process_diff}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-process_diff_local}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      PLAYWRIGHT_BASE_URL: "http://web:3000"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
